<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>For My Princess</title>

  <!-- =========================
       FONTS
       ========================= -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@200;300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================
       COLOR PALETTE
       ========================================= */

    :root {
      --wine: #180A12;
      --wine-deep: #0e050a;

      --crimson: #C7365F;
      --rose: #F06A8D;
      --blush: #FFD6E0;

      --gold: #E8C98B;

      --white: #FFF8F9;
      --muted: #C9AEB6;

      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Montserrat", sans-serif;
    }


    /* =========================================
       RESET
       ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;

      background: var(--wine);

      color: var(--white);

      font-family: var(--sans);

      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
    }


    body {
      min-height: 100dvh;

      position: relative;

      overscroll-behavior-y: none;
    }


    /* =========================================
       BACKGROUND
       ========================================= */

    .background {
      position: fixed;

      inset: 0;

      z-index: 0;

      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(199, 54, 95, 0.15),
          transparent 38%
        ),
        radial-gradient(
          circle at 20% 80%,
          rgba(240, 106, 141, 0.07),
          transparent 32%
        ),
        linear-gradient(
          145deg,
          #180A12,
          #10060b
        );
    }


    /* =========================================
       AMBIENT LIGHT
       ========================================= */

    .light-one,
    .light-two {
      position: absolute;

      border-radius: 50%;

      pointer-events: none;

      filter: blur(70px);
    }


    .light-one {
      width: 70vw;
      height: 70vw;

      max-width: 520px;
      max-height: 520px;

      top: 15%;
      left: 50%;

      transform: translateX(-50%);

      background: rgba(199, 54, 95, 0.12);

      animation: breathe 10s ease-in-out infinite alternate;
    }


    .light-two {
      width: 55vw;
      height: 55vw;

      bottom: -10%;
      right: -15%;

      background: rgba(232, 201, 139, 0.045);

      animation: floatLight 14s ease-in-out infinite alternate;
    }


    @keyframes breathe {

      from {
        transform: translateX(-50%) scale(0.9);
        opacity: 0.55;
      }

      to {
        transform: translateX(-50%) scale(1.12);
        opacity: 1;
      }

    }


    @keyframes floatLight {

      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(-10%, -15%);
      }

    }


    /* =========================================
       PARTICLES
       ========================================= */

    #particles {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;

      pointer-events: none;
    }


    /* =========================================
       VIGNETTE
       ========================================= */

    .vignette {
      position: fixed;

      inset: 0;

      z-index: 2;

      pointer-events: none;

      box-shadow:
        inset 0 0 100px rgba(0, 0, 0, 0.75);
    }


    /* =========================================
       MAIN SCREEN
       ========================================= */

    .screen {
      position: relative;

      z-index: 10;

      width: 100%;
      min-height: 100dvh;

      display: flex;

      justify-content: center;
      align-items: center;

      padding: 30px 22px;

      text-align: center;
    }


    .content {
      width: 100%;
      max-width: 520px;

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    /* =========================================
       TOP LABEL
       ========================================= */

    .eyebrow {
      display: flex;

      align-items: center;

      gap: 14px;

      margin-bottom: 24px;

      opacity: 0;

      transform: translateY(18px);

      animation:
        revealUp 1.4s
        cubic-bezier(.16,1,.3,1)
        0.3s
        forwards;
    }


    .line {
      width: 32px;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(232, 201, 139, 0.65),
        transparent
      );
    }


    .eyebrow span {
      font-size: 10px;

      letter-spacing: 0.32em;

      text-transform: uppercase;

      font-weight: 300;

      color: var(--gold);

      text-shadow:
        0 0 15px rgba(232, 201, 139, 0.35);
    }


    /* =========================================
       MAIN TITLE
       ========================================= */

    .title {
      font-family: var(--serif);

      font-size: clamp(
        58px,
        15vw,
        88px
      );

      font-weight: 300;

      line-height: 0.95;

      letter-spacing: -0.02em;

      margin-bottom: 25px;

      color: var(--white);

      opacity: 0;

      filter: blur(12px);

      transform: translateY(25px);

      animation:
        titleReveal 1.8s
        cubic-bezier(.16,1,.3,1)
        0.6s
        forwards;

      text-shadow:
        0 10px 35px rgba(0,0,0,.55),
        0 0 45px rgba(199,54,95,.18);
    }


    .title span {
      display: block;

      color: var(--blush);

      font-style: italic;

      font-weight: 400;

      margin-top: 4px;
    }


    /* =========================================
       SUBTITLE
       ========================================= */

    .subtitle {
      max-width: 320px;

      font-size: 13px;

      line-height: 1.8;

      font-weight: 300;

      letter-spacing: 0.025em;

      color: var(--muted);

      margin-bottom: 42px;

      opacity: 0;

      transform: translateY(20px);

      animation:
        revealUp 1.5s
        cubic-bezier(.16,1,.3,1)
        1s
        forwards;
    }


    /* =========================================
       ENTER BUTTON
       ========================================= */

    .enter-button {
      position: relative;

      width: min(280px, 90%);

      min-height: 58px;

      border-radius: 999px;

      border: 1px solid rgba(240,106,141,.35);

      background:
        rgba(199,54,95,.10);

      color: var(--white);

      font-family: var(--sans);

      font-size: 11px;

      font-weight: 400;

      letter-spacing: 0.22em;

      text-transform: uppercase;

      cursor: pointer;

      overflow: hidden;

      backdrop-filter: blur(16px);

      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,214,224,.15);

      opacity: 0;

      transform: translateY(22px);

      animation:
        revealUp 1.5s
        cubic-bezier(.16,1,.3,1)
        1.3s
        forwards;

      transition:
        transform .35s ease,
        border-color .35s ease,
        background .35s ease,
        box-shadow .35s ease;
    }


    .enter-button::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        radial-gradient(
          circle at center,
          rgba(240,106,141,.22),
          transparent 70%
        );

      opacity: 0;

      transition: opacity .4s ease;
    }


    .enter-button:active {
      transform: scale(.96);
    }


    .enter-button:hover {
      border-color: rgba(232,201,139,.65);

      background:
        rgba(199,54,95,.16);

      box-shadow:
        0 18px 45px rgba(199,54,95,.20),
        inset 0 1px 0 rgba(232,201,139,.25);
    }


    .enter-button:hover::before {
      opacity: 1;
    }


    .button-inner {
      position: relative;

      z-index: 2;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 12px;
    }


    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--gold);

      box-shadow:
        0 0 12px rgba(232,201,139,.8);

      animation:
        dotPulse 2.2s ease-in-out infinite;
    }


    @keyframes dotPulse {

      0%, 100% {
        transform: scale(.8);
        opacity: .65;
      }

      50% {
        transform: scale(1.25);
        opacity: 1;
      }

    }


    /* =========================================
       SMALL BOTTOM TEXT
       ========================================= */

    .bottom-note {
      position: absolute;

      bottom: 28px;

      left: 0;
      right: 0;

      text-align: center;

      font-size: 8px;

      letter-spacing: .28em;

      text-transform: uppercase;

      color: rgba(201,174,182,.45);

      font-weight: 300;

      opacity: 0;

      animation:
        fadeIn 1.5s ease
        2s
        forwards;
    }


    /* =========================================
       ANIMATIONS
       ========================================= */

    @keyframes revealUp {

      from {
        opacity: 0;

        transform:
          translateY(22px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    @keyframes titleReveal {

      from {
        opacity: 0;

        filter: blur(14px);

        transform:
          translateY(25px)
          scale(.98);
      }

      to {
        opacity: 1;

        filter: blur(0);

        transform:
          translateY(0)
          scale(1);
      }

    }


    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    /* =========================================
       EXIT ANIMATION
       ========================================= */

    .screen.exit {
      animation:
        screenExit 1.1s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }


    @keyframes screenExit {

      to {
        opacity: 0;

        transform:
          scale(.97)
          translateY(-25px);

        filter: blur(12px);
      }

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 480px) {

      .screen {
        padding:
          25px 18px;
      }

      .title {
        font-size: 64px;
      }

      .subtitle {
        font-size: 12px;

        max-width: 290px;
      }

      .enter-button {
        width: 88%;

        min-height: 56px;
      }

    }


    /* =========================================
       REDUCE MOTION
       ========================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       BACKGROUND
       ========================================= -->

  <div class="background">

    <div class="light-one"></div>

    <div class="light-two"></div>

  </div>


  <!-- PARTICLES -->

  <canvas id="particles"></canvas>


  <!-- VIGNETTE -->

  <div class="vignette"></div>


  <!-- =========================================
       OPENING SCREEN
       ========================================= -->

  <main class="screen" id="openingScreen">

    <div class="content">


      <!-- TOP LABEL -->

      <div class="eyebrow">

        <div class="line"></div>

        <span>For My Princess</span>

        <div class="line"></div>

      </div>


      <!-- TITLE -->

      <h1 class="title">

        My

        <span>Princess</span>

      </h1>


      <!-- SUBTITLE -->

      <p class="subtitle">

        A little place I made for someone
        who became very special to me.

      </p>


      <!-- BUTTON -->

      <button
        class="enter-button"
        id="enterButton"
        type="button"
      >

        <span class="button-inner">

          <span class="dot"></span>

          <span>Enter My Heart</span>

        </span>

      </button>


    </div>


    <!-- BOTTOM -->

    <div class="bottom-note">

      Made with love · Just for you

    </div>

  </main>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->

  <script>

    /* =========================================
       PARTICLE SYSTEM
       ========================================= */

    const canvas =
      document.getElementById("particles");

    const ctx =
      canvas.getContext("2d");

    let width;
    let height;
    let particles = [];


    function resizeCanvas() {

      const dpr =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );

      width =
        window.innerWidth;

      height =
        window.innerHeight;

      canvas.width =
        width * dpr;

      canvas.height =
        height * dpr;

      canvas.style.width =
        width + "px";

      canvas.style.height =
        height + "px";

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

    }


    class Particle {

      constructor() {

        this.reset(true);

      }


      reset(initial = false) {

        this.x =
          Math.random() * width;

        this.y =
          initial
            ? Math.random() * height
            : height + 10;

        this.size =
          Math.random() * 1.3 + .35;

        this.speed =
          Math.random() * .22 + .08;

        this.drift =
          (Math.random() - .5) * .12;

        this.alpha =
          Math.random() * .35 + .08;

        this.gold =
          Math.random() > .72;

      }


      update() {

        this.y -= this.speed;

        this.x += this.drift;


        if (
          this.y < -10 ||
          this.x < -10 ||
          this.x > width + 10
        ) {

          this.reset();

        }

      }


      draw() {

        const color =
          this.gold
            ? "232,201,139"
            : "255,214,224";


        ctx.beginPath();

        ctx.arc(
          this.x,
          this.y,
          this.size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          `rgba(${color},${this.alpha})`;

        ctx.fill();

      }

    }


    function createParticles() {

      particles = [];

      const count =
        window.innerWidth < 500
          ? 28
          : 38;


      for (
        let i = 0;
        i < count;
        i++
      ) {

        particles.push(
          new Particle()
        );

      }

    }


    function animateParticles() {

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      particles.forEach(
        particle => {

          particle.update();

          particle.draw();

        }
      );


      requestAnimationFrame(
        animateParticles
      );

    }


    resizeCanvas();

    createParticles();

    animateParticles();


    window.addEventListener(
      "resize",
      () => {

        resizeCanvas();

        createParticles();

      },
      { passive: true }
    );


    /* =========================================
       ENTER BUTTON
       ========================================= */

    const enterButton =
      document.getElementById(
        "enterButton"
      );

    const openingScreen =
      document.getElementById(
        "openingScreen"
      );


    enterButton.addEventListener(
      "click",
      () => {

        openingScreen.classList.add(
          "exit"
        );


        /*
          SECTION 2 WILL BE ADDED HERE.

          For now, after the opening
          animation finishes, we simply
          keep the page ready for the
          next section.
        */

        setTimeout(() => {

          console.log(
            "Opening completed. Ready for Section 2."
          );

        }, 1100);

      }
    );

  </script>

</body>
  </html>
